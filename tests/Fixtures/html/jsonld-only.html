<script type="application/ld+json">{"@context":"https://schema.org","@type":"NewsArticle","headline":"Chuva forte provoca alagamentos na zona norte","datePublished":"2026-03-02T21:10:00-03:00","author":{"@type":"Person","name":"Paulo Mendes"},"articleBody":"A chuva forte que caiu no fim da tarde deste domingo provocou alagamentos em pelo menos seis bairros da zona norte.\n\nA Defesa Civil registrou mais de oitenta milímetros em duas horas, volume esperado para metade do mês.\n\nDuas escolas tiveram as aulas de segunda-feira suspensas por causa da água que invadiu as salas do térreo.\n\nA previsão é de tempo firme a partir de terça-feira, com temperaturas mais altas durante a tarde."}</script>
